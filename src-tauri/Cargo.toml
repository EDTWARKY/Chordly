[package]
name = "chordly"
version = "1.0.0"
description = "A monochrome, lossless desktop music experience."
authors = ["Chordly"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chordly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
